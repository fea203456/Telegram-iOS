name: Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    # The macos-14 and macos-15 images do not carry the Xcode 27.1 pin.
    runs-on: xcode-27
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode and reclaim disk space
        id: xcode
        run: |
          version=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          selected="/Applications/Xcode_${version}.app"
          if [[ ! -d "$selected/Contents/Developer" ]]; then
            echo "::error::Xcode $version is required by versions.json but is missing from the runner."
            exit 1
          fi
          sudo xcode-select --switch "$selected/Contents/Developer"
          xcodebuild -version
          echo "build=$(xcodebuild -version | awk '/^Build version / { print $3 }')" >> "$GITHUB_OUTPUT"

          df -h "$RUNNER_TEMP"
          xcrun simctl runtime delete all || echo "::warning::Some simulator runtimes could not be removed."
          for xcode in /Applications/Xcode*.app; do
            if [[ -d "$xcode" && ! -L "$xcode" && ! "$xcode" -ef "$selected" ]]; then
              sudo rm -rf -- "$xcode"
            fi
          done
          xcrun --sdk iphoneos --show-sdk-path
          df -h "$RUNNER_TEMP"

      - name: Check out pinned submodules
        run: |
          # The fork-relative tgcalls URL is unavailable. The upstream serves the pinned commit.
          git -c submodule.submodules/TgVoipWebrtc/tgcalls.url=https://github.com/TelegramMessenger/tgcalls.git \
            submodule update --init --recursive --depth 1 --jobs 4

      - name: Cache Bazel build outputs
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: ios-ipa-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('versions.json', 'MODULE.bazel*', '.bazelrc') }}-${{ github.sha }}
          restore-keys: |
            ios-ipa-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('versions.json', 'MODULE.bazel*', '.bazelrc') }}-

      - name: Build and verify unsigned device IPA
        shell: bash
        run: |
          build_number=$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))
          # The pinned rules_apple skips signing with this feature but still
          # requires an embedded profile for device apps and extensions.
          git -C build-system/bazel-rules/rules_apple apply <<'PATCH'
          diff --git a/apple/internal/ios_rules.bzl b/apple/internal/ios_rules.bzl
          --- a/apple/internal/ios_rules.bzl
          +++ b/apple/internal/ios_rules.bzl
          @@ -452,5 +452,5 @@
          -    if platform_prerequisites.platform.is_device:
          +    if platform_prerequisites.platform.is_device and "disable_legacy_signing" not in features:
                   processor_partials.append(
                       partials.provisioning_profile_partial(
                           actions = actions,
                           profile_artifact = provisioning_profile,
          @@ -1433,5 +1433,5 @@
          -    if platform_prerequisites.platform.is_device:
          +    if platform_prerequisites.platform.is_device and "disable_legacy_signing" not in features:
                   processor_partials.append(
                       partials.provisioning_profile_partial(
                           actions = actions,
                           profile_artifact = provisioning_profile,
          PATCH
          printf '\nbuild --features=disable_legacy_signing --//Telegram:disableProvisioningProfiles --//Telegram:embedWatchApp=false\n' >> .bazelrc
          build_log="$RUNNER_TEMP/telegram-ipa-build.log"
          built=false
          for attempt in 1 2 3; do
            if python3 build-system/Make/Make.py --cacheDir="$HOME/.cache/bazel" build \
              --configurationPath=build-system/appstore-configuration.json \
              --xcodeManagedCodesigning \
              --buildNumber="$build_number" \
              --configuration=release_arm64 2>&1 | tee "$build_log"; then
              built=true
              break
            fi
            if [[ "$attempt" == 3 ]] || ! grep -Eq 'Failed to fetch registry file.*(Unknown host|Connection reset|timed out)' "$build_log"; then
              break
            fi
            echo "::warning::Bazel registry request failed. Retrying the build."
            sleep "$((attempt * 15))"
          done
          if [[ "$built" == false ]]; then
            python3 - "$build_log" <<'PY'
          import re
          import sys

          with open(sys.argv[1], errors="replace") as log:
              errors = []
              for line in log:
                  line = re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", line).strip()
                  if (line.startswith("ERROR:") or ": error:" in line or "fatal error:" in line) and line not in errors:
                      errors.append(line)
              for error in errors[:12]:
                  print("::error::" + error.replace("%", "%25"))
          PY
            exit 1
          fi

          ipa="$RUNNER_TEMP/Telegram.ipa"
          cp bazel-bin/Telegram/Telegram.ipa "$ipa"
          python3 - "$ipa" <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile(sys.argv[1]) as ipa:
              if ipa.testzip() is not None:
                  sys.exit("IPA failed ZIP integrity verification")
              names = ipa.namelist()
              if "Payload/Telegram.app/Telegram" not in names:
                  sys.exit("IPA is missing the Telegram executable")
              if any(name.endswith(("/embedded.mobileprovision", "/_CodeSignature/CodeResources")) for name in names):
                  sys.exit("IPA contains a provisioning profile or bundle signature")
          PY

      - name: Upload Telegram.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-unsigned-ios
          path: ${{ runner.temp }}/Telegram.ipa
          if-no-files-found: error
          compression-level: 0
